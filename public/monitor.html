<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>站点详情</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script>
// 主题在 CSS 之前定好，避免闪白（FOUC）
// 优先级：用户手动选择 > 服务端设置的默认主题（由首页写入 theme-default） > 跟随系统
(function () {
  try {
    var t = localStorage.getItem("theme") || localStorage.getItem("theme-default");
    if (!t || t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    if (t === "dark") document.documentElement.classList.add("dark");
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <span id="brand-name">站点状态</span>
    </div>
    <nav class="nav">
      <button class="icon-btn" id="theme" title="切换主题" aria-label="切换主题">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="wrap stack page-top">

  <a class="back" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    返回总览
  </a>

  <div class="between page-head">
    <div style="min-width:0">
      <h1 id="title">加载中…</h1>
      <p id="subtitle"></p>
    </div>
    <div class="row">
      <button class="btn" id="refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        刷新
      </button>
      <a class="btn" id="visit" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></svg>
        打开站点
      </a>
    </div>
  </div>

  <!-- 当前窗口的关键指标 -->
  <section class="stats" id="kpis"></section>

  <!-- 响应时间趋势 -->
  <div class="card glass">
    <div class="sec-head">
      <h2>响应时间趋势</h2>
      <div class="seg" id="range">
        <button data-h="6">6 小时</button>
        <button data-h="24" class="on">24 小时</button>
        <button data-h="168">7 天</button>
        <button data-h="720">30 天</button>
      </div>
    </div>
    <div class="sec-body">
      <div class="chart-wrap" id="chart"></div>
    </div>
    <div class="legend">
      <!-- 颜色一律引用 CSS 变量：写死 hsl 值会让图例与折线/红点各走一套，
           以后调主色或故障色时必然出现"图例是旧色、图上是新色"。 -->
      <span><i style="background:hsl(var(--primary))"></i>平均响应时间</span>
      <span><i style="background:hsl(var(--destructive))"></i>该时段存在失败</span>
      <span class="muted" id="bucket"></span>
    </div>
  </div>

  <!-- 30 天可用率色条 -->
  <div class="card glass">
    <div class="sec-head">
      <h2>运行时间历史（最近 30 天）</h2>
      <span class="muted" style="font-size:var(--text-xs)" id="barsum"></span>
    </div>
    <div class="sec-body">
      <div class="bar bar-lg" id="bar"></div>
      <div class="bar-axis"><span>今天</span><span>15 天前</span><span>30 天前</span></div>
    </div>
  </div>

  <!-- 最近检查 -->
  <div class="card glass">
    <div class="sec-head">
      <h2>最近检查</h2>
      <span class="muted" style="font-size:var(--text-xs)" id="recentsum"></span>
    </div>
    <!-- 占位与「故障记录」刻意用同一种样式：两张卡片同属一个 /api/site 响应、
         同一帧写入，加载期间看起来必须一样，否则空白会被误读成"这张更慢"。 -->
    <div class="lst" id="recent"></div>
  </div>

  <!-- 故障记录 -->
  <div class="card glass">
    <div class="sec-head">
      <h2>故障记录</h2>
      <span class="muted" style="font-size:var(--text-xs)" id="incsum"></span>
    </div>
    <div class="lst" id="incidents"></div>
  </div>

  <p class="muted" style="font-size:var(--text-xs);margin:0" id="foot"></p>
</main>

<div class="tip" id="tip" role="tooltip"></div>

<!-- 骨架屏：数据到达前先把每张卡的位置和尺寸搭出来（文字换成灰条）。
     不占位的实测代价：数据到达的那一帧整页高度 937px → 2168px、CLS 0.74，
     下面的卡片被整体顶下去一次 —— 观感就是"卡片被内容拖了一下"。
     占位用的是与真实卡片**同一套 class**（.stat/.lst-row/.inc-row + .sk 灰条），
     行高由真实字号决定，因此是逐像素等高的占位，不是"估个大概"。
     （原先这里还给 4 张「站点信息卡」占位；那 4 张卡已整块移除，占位随之删掉。）
     同步脚本，跑在 defer 的 monitor.js 之前、也跑在首帧之前：
     有 localStorage 缓存时 monitor.js 会在首帧前就填好真实数据，骨架根本不会露脸。 -->
<script>
(function () {
  var D = document;
  var sk = function (t, cls) {
    return '<span class="' + (cls ? cls + " " : "") + 'sk">' + t + "</span>";
  };
  var put = function (id, html) {
    var el = D.getElementById(id);
    if (el) el.innerHTML = html;
  };
  var card = function (inner, extra) {
    return '<div class="card glass ' + extra + ' skel" aria-hidden="true">' + inner + "</div>";
  };
  var body = function (lines) {
    return '<div style="min-width:0">' + lines + "</div>";
  };

  // 5 张指标卡（顺序与 renderKpis 完全一致：可用率 / SSL 证书 / 检查间隔 / 平均响应 / 失败次数）
  put("kpis", ["可用率", "SSL 证书", "检查间隔", "平均响应", "失败次数"].map(function (label) {
    return card(
      '<div class="stat-icon i-muted"></div>' +
        body('<p class="stat-label">' + sk(label) + '</p><p class="stat-value">' + sk("000 ms") + "</p>"),
      "stat"
    );
  }).join(""));

  // 图表：整块灰底（高度由 .chart-wrap 的 min-height:260px 兜住）
  put("chart", '<div class="chart-skel" aria-hidden="true"></div>');

  // 色条：一条灰条，与"无数据"时同款，高度同为 34px
  put("bar", '<span class="skel" aria-hidden="true"></span>');

  // 最近检查：占位行结构与真实行完全一致（badge + 状态码 + 耗时 + 备注 + 时间）。
  // 20 行是**刻意写死**的：骨架的作用只是"在数据到达前把卡片撑到接近最终高度、避免 CLS"，
  // 不必与 recent_limit 精确相等 —— 反过来，跟着配置变就等于把"防跳动"这件事
  // 和服务端设置耦合起来，改一次默认值要记得回来同步这里。真数据到达时整块被替换。
  put("recent", Array(21).join(
    '<div class="lst-row skel" aria-hidden="true">' + sk("正常", "badge") +
      sk("200") + sk("155 ms") + sk("cfapi · H2", "grow") + sk("2026-01-01 00:00:00") + "</div>"
  ));

  // 故障记录：占位一行。绝大多数站点此刻没有故障，真为空时卡片只会比占位矮约 10px
  put("incidents", '<div class="inc-row skel" aria-hidden="true">' + sk("已恢复", "badge") +
    '<div class="grow" style="min-width:0">' + sk("HTTP 500") +
    '<div style="margin-top:var(--sp-2xs)">' + sk("2026-01-01 00:00:00 → 00:00:00 · 历时 1 分 0 秒") +
    "</div></div></div>");
})();
</script>
<script src="/monitor.js" defer></script>
<script>
// Service Worker：第二次访问起外壳走本地缓存，绕开 CF 首访 ~1s 的网络成本。
if ("serviceWorker" in navigator) {
  // ⚠️ 发版后要「一次 F5 就看到新版」，光靠 SW 的 skipWaiting 不够：
  //    外壳是缓存优先，这次导航是旧 SW 应答的（新 SW 要等这次导航结束才接管），
  //    直接刷新看到的仍是旧页面；而且 /*.css 有 5 分钟 HTTP 新鲜期，
  //    连按多次也刷不掉，只能硬刷。新 SW 接管(claim)那一刻 controller 会变，
  //    就地重载一次即可。守卫：首访时 controller 为 null —— 那时装好后 claim
  //    也会触发一次 controllerchange，不挂监听就不会白闪第二下。
  if (navigator.serviceWorker.controller) {
    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  }
  navigator.serviceWorker.register("/sw.js").catch(function () {});
}
</script>
</body>
</html>
