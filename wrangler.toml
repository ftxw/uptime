name = "uptime"
main = "src/index.js"
compatibility_date = "2026-09-22"

# ── ⚠️ 必须保留：别让部署清空 Dashboard 上设的变量 ─────────────────────
# `wrangler deploy` 会把「版本的全部明文变量」按本地配置重写，
# 因此只在 Cloudflare 控制台填的明文变量会在下一次部署时被整个清掉。
# keep_vars = true 让 wrangler 不去动 Dashboard 上的变量。
# （Secrets 本来就跨部署保留，与这一项无关 —— 敏感值仍建议用 Secret。）
keep_vars = true

# ── 对外入口 ──────────────────────────────────────────────────────────
# 这里**故意不写任何 [[routes]]**：域名由你在 Cloudflare 控制台手动绑定。
# routes 是声明式的，写进来 wrangler 每次部署都会按配置重建 DNS 与证书；
# 交给人工绑定更省心：换域名不必改仓库，也不必重新 deploy。
#
# ⚠️ 必须显式打开 workers.dev：不写 [[routes]] 时 wrangler 会把它关掉，
#    那样在控制台绑好域名之前，部署出来连一个自检地址都没有。
# ⚠️ 位置敏感：这是**顶层**字段，必须写在任何 [table] / [[array]] 之前。
workers_dev = true

# ── 定时 ──────────────────────────────────────────────────────────────
# 每分钟触发一次：每个站点的监测间隔是独立配置的（1/5/10/30/60 分钟），
# cron 必须按**最细粒度（1 分钟）**来跑，再由 dueSites() 按各站点的间隔筛选，
# 只对「距上次检查已达间隔」的站点发起探测。若这里写 */5，1 分钟的站点仍是 5 分钟一次。
#
# cron 触发本身很轻（一次 D1 查询）：没有站点到期就既不调 Globalping 也不写 checks。
# 探测位置与 cron 执行位置无关：活交给 Globalping 的第三方探针执行。
#
# 免费计划：每账号最多 5 个 cron trigger，最小粒度 1 分钟，时区固定 UTC。
[triggers]
crons = ["* * * * *"]

# ── 存储：所有数据都在这一张 D1 里（建表语句见 schema.sql）──────────────
# database_id 由 scripts/setup-d1.mjs 自动维护：**提交进仓库的应始终是空值**。
# 流程是「按名字列出账号下的库 → 没有就 d1 create → 写回 uuid → 建表 → 校验结构」，
# 全程幂等，且**只认库名、不认已有 uuid**。
[[d1_databases]]
binding = "DB"
database_name = "uptime-db"
database_id = ""

# ── 静态资源（前台 + 后台）─────────────────────────────────────────────
# Workers Static Assets：命中静态文件时**不执行 Worker**，这类请求也不消耗
# Worker 请求额度（免费层 10 万/天）。默认 run_worker_first = false →
# 先匹配静态文件，未命中才进 Worker，所以 /api/* 自动落到 Worker。
[assets]
directory = "./public"
binding = "ASSETS"
